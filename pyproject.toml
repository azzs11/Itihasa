[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "itihasa"
version = "0.1.0.dev0"
description = "Knowledge graph and discovery platform for India's cultural heritage documents"
readme = "README.md"
licence = { text = "Apache-2.0" }
authors = [{ name = "Akchhya Singh", email = "akchhya.dev@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic==2.14.3",
    "sqlalchemy==2.1.8",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.8",
    "pgvector==0.5.1",
]

[project.optional-dependencies]
dev = [
    "pre-commit==4.7.0",
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/itihasa"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["itihasa"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["alembic.*", "pgvector.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"
markers = [
    "db: requires a live PostgreSQL database (deselect with -m 'not db')",
]

[tool.coverage.run]
source = ["src/itihasa"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
