repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        args: [--config-file, pyproject.toml]
        additional_dependencies:
          - pydantic==2.14.3
          - sqlalchemy==2.1.8
          - alembic==1.20.1
          - psycopg[binary]==3.3.8
          - pgvector==0.5.1
